/* العنوانين فوق، وبينهم وبين النجوم مسافة واضحة بكل الأطوال (النجوم تبدأ تقريباً عند 62% من الطول ناقص 194px) */

.top:after{content:"";display:block;width:120px;height:3px;background:#d6b25e;margin:18px auto 0;border-radius:2px}
.art{position:absolute;left:0;right:0;top:62%;margin:0;transform:translateY(-83%);display:flex;justify-content:center}.art svg{width:300px;overflow:visible}

.bot{position:absolute;left:0;right:0;bottom:90px}.c{font-size:38px}

html,body{background:#061126;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#sp{z-index:5;transition:opacity .45s ease}
#sp.out{opacity:0;pointer-events:none}
/* نافذة تسجيل عون (ب-٣): صغيرة وظاهرة طول التسجيل */
.mic{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:#fff;color:#0d2347;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:12px 14px;font:16px/1.5 system-ui,sans-serif;direction:rtl;text-align:center}
.mic[hidden]{display:none}.mic .mt{font-weight:bold}.mic .mtm{display:block;font-size:22px;margin:2px 0}.mic .mr{display:flex;gap:10px;justify-content:center;margin-top:8px}
.mic button{min-width:96px;padding:9px 14px;border-radius:10px;border:0;font:inherit;font-weight:bold}.mic .ok{background:#7a141c;color:#fff}.mic .no{background:#e8ecf2;color:#0d2347}

<script>
/* حفظ الدخول هني: آيفون يمسح ذاكرة البرنامج الداخلي مع تسكير المتصفح. ما نرد إلا على صفحة البرنامج المعروضة داخل هالصفحة. */
(function(){
/* المفاتيح المسموحة بس: قسم (ب) بأسمائه القديمة، وقسم (أ)/(ج) ببادئة القسم، والمؤسس، واختيار القسم */
var K={kabd_dept:1,kabd_F_session:1,kabd_F_device:1,kabd_F_seen:1,kabd_look:1};['kabd_','kabd_A_','kabd_C_'].forEach(function(p){['session','device','request','app','last','cards'].forEach(function(b){K[p+b]=1})});
var RX=/^https:\/\/n-[a-z0-9]+-[a-z0-9]+-script\.googleusercontent\.com$/;
function ok(){try{localStorage.setItem('kabd_t','1');localStorage.removeItem('kabd_t');return true}catch(e){return false}}
addEventListener('message',function(ev){
var d=ev.data,s=ev.source;if(!d||d.kabd!==1||!s||!RX.test(ev.origin))return;
try{if(s.top!==window||s===window)return}catch(e){return}
if(d.op==='load'&&typeof d.id==='string'&&d.id.length<=40){var o={},k;for(k in K){try{o[k]=localStorage.getItem(k)}catch(e){o[k]=null}}s.postMessage({kabd:1,op:'data',id:d.id,ok:ok(),data:o},ev.origin);if(M.can)s.postMessage({kabd:1,op:'mic',t:'ready'},ev.origin)}
else if(d.op==='set'&&K[d.k]===1&&K.hasOwnProperty(d.k)){try{if(d.v===null)localStorage.removeItem(d.k);else if(typeof d.v==='string'&&d.v.length<3000000)localStorage.setItem(d.k,d.v)}catch(e){}}
else if(d.op==='mic'&&d.t==='start')M.start(s,ev.origin);
else if(d.op==='mic'&&d.t==='cancel')M.cancel(s);
});
/* مايك عون (قرار مايك عون بالتطبيق المثبت، ب-١..ب-٧): الصفحة تسجل بدال البرنامج (الإطار ما عنده إذن المايك).
 * طلب المايك (الصوت بس) بمكان واحد (rec0). التسجيل يبدأ بس بعد "ابدأ" من البرنامج + ضغطة حقيقية (userActivation)، وإلا زر "سجّل".
 * نافذة صغيرة ظاهرة طول التسجيل. الصوت يرجع للنافذة اللي طلبت بس وبمصدرها، بعد التأكد إنها للحين داخل الصفحة.
 * ١٢٠ ثانية و3MB بالكثير، والنوع من قائمة ثابتة. ولا اتصال ولا تخزين ولا سجل. تسجيل واحد بكل وقت، والمايك يتسكر مع أي خروج. */
var M=(function(){
var TYPES=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'],MAX_SEC=120,MAX_B=3*1024*1024,mime='';
try{if(navigator.mediaDevices&&window.MediaRecorder)TYPES.some(function(t){try{if(MediaRecorder.isTypeSupported(t)){mime=t;return true}}catch(e){}return false})}catch(e){}
var req=null,st=null,box=null,gen=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
function live(w){try{return !!w&&w.top===window&&w!==window}catch(e){return false}} /* نفس فحص المصدر فوق: للحين داخل هالصفحة */
function send(m){var r=req;if(!r)return;if(!live(r.s))return;try{r.s.postMessage(m,r.o)}catch(e){}}
function ui(rec){
if(!box){box=el('div','mic');box.setAttribute('role','dialog');box.setAttribute('aria-label','تسجيل صوت لعون');document.body.appendChild(box)}
box.textContent='';box.hidden=false;
var t=el('div','mt',rec?'● يسجّل…':'عون يبي يسجّل صوتك'),tm=el('b','mtm',rec?'0:00':''),row=el('div','mr');
box.appendChild(t);if(rec)box.appendChild(tm);box.appendChild(row);
if(rec){var a=el('button','ok','خلصت');a.type='button';a.id='micDone';a.onclick=function(){stop(true)};row.appendChild(a)}
else{var g=el('button','ok','سجّل');g.type='button';g.id='micGo';g.onclick=function(){if(req&&!st)rec0()};row.appendChild(g)}
var c=el('button','no','إلغاء');c.type='button';c.id='micNo';c.onclick=function(){end('cancel')};row.appendChild(c);
return tm}
function end(code){if(code&&req)send({kabd:1,op:'mic',t:'error',c:code});stop(false);clean()}
function clean(){gen++;if(st){try{clearInterval(st.iv)}catch(e){}try{st.mr.ondataavailable=null;st.mr.onstop=null;if(st.mr.state!=='inactive')st.mr.stop()}catch(e){}try{st.stream.getTracks().forEach(function(x){x.stop()})}catch(e){}st.chunks=[];st=null}req=null;if(box){box.hidden=true;box.textContent=''}}
function rec0(){
var my=++gen;
navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
if(my!==gen||!req){stream.getTracks().forEach(function(x){x.stop()});return}
var mr;try{mr=new MediaRecorder(stream,{mimeType:mime})}catch(e){stream.getTracks().forEach(function(x){x.stop()});return end('rec')}
var tm=ui(true),t0=Date.now();st={mr:mr,stream:stream,chunks:[],size:0,t0:t0,send:false};
st.iv=setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);tm.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);if(s>=MAX_SEC)stop(true)},500);
mr.ondataavailable=function(e){if(!st||!e.data||!e.data.size)return;st.size+=e.data.size;if(st.size>MAX_B)return end('size');st.chunks.push(e.data)};
mr.onstop=function(){
if(!st)return;var x=st,go=x.send,sec=Math.max(1,Math.min(MAX_SEC,Math.round((Date.now()-x.t0)/1000)));
x.stream.getTracks().forEach(function(y){y.stop()});clearInterval(x.iv);
if(!go){return clean()}
var b=new Blob(x.chunks,{type:mime.split(';')[0]});x.chunks=[];
if(b.size>MAX_B||!b.size)return end(b.size?'size':'empty');
var fr=new FileReader(),my2=gen;fr.onload=function(){if(my2!==gen)return;var s=String(fr.result||''),a=s.slice(s.indexOf(',')+1);send({kabd:1,op:'mic',t:'audio',audio:a,mime:mime.split(';')[0],sec:sec});clean()};fr.onerror=function(){end('rec')};fr.readAsDataURL(b)};
mr.start(1000)
}).catch(function(){if(my===gen)end('denied')})}
function stop(ok){if(!st)return;st.send=!!ok;try{if(st.mr.state!=='inactive')st.mr.stop();else if(!ok)clean()}catch(e){clean()}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&(req||st))end('cancel')});
addEventListener('pagehide',function(){if(req||st)end('cancel')});
return{can:!!mime,
start:function(s,o){if(!mime)return;if(req||st){try{s.postMessage({kabd:1,op:'mic',t:'error',c:'busy'},o)}catch(e){}return}if(!live(s))return;req={s:s,o:o};
var act=false;try{act=!!(navigator.userActivation&&navigator.userActivation.isActive)}catch(e){}
if(act)rec0();else ui(false)},
cancel:function(s){if(req&&req.s===s)end('')},
reset:function(){if(req||st)end('')}};
})();
document.addEventListener('DOMContentLoaded',function(){document.getElementById('app').addEventListener('load',M.reset)}); /* الإطار انعاد تحميله: المايك يتسكر */
})();
</script>
<iframe id="app" title="متابعة القسم"></iframe>
<script>
var sp=document.getElementById('sp'),t0=Date.now();function hide(){sp.className='out'}
/* الرابط المباشر: ?d=A / ?d=B / ?d=C أو ?p=f (هالقيم بس) تنمرر للبرنامج. شاشة البداية تكتب القسم المحفوظ أو اللي بالرابط. */
var q=new URLSearchParams(location.search),qd=/^[ABC]$/.test(q.get('d')||'')?q.get('d'):'',qf=q.get('p')==='f',pass=qf?'?p=f':qd?'?d='+qd:'';
var sd='';try{sd=localStorage.getItem('kabd_dept')||(localStorage.getItem('kabd_session')?'B':'')}catch(e){}
var LB={A:'قسم (أ)',B:'قسم (ب)',C:'قسم (ج)'},lb=qf?'المؤسس':(LB.hasOwnProperty(sd)?LB[sd]:LB.hasOwnProperty(qd)?LB[qd]:'');
document.getElementById('spDept').textContent=lb;if(!lb)document.getElementById('spDept').hidden=true;
var fr=document.getElementById('app');if(window.top===window)fr.src='https://script.google.com/macros/s/AKfycbwJuSjBBE4tcxYskRdGllFb87SKaMdYKyi7WatbZDnC5xG91iMrSV1Ve-kVJZ9lpxK83A/exec'+pass;/* ما يشتغل إذا انعرضت الصفحة داخل موقع ثاني */
fr.addEventListener('load',function(){setTimeout(hide,Math.max(300,2000-(Date.now()-t0)))});setTimeout(hide,8000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
