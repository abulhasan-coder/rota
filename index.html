<style>
html,body{height:100%;margin:0;background:#0d2347}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#splash{position:fixed;inset:0;z-index:2;background:#0d2347;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font:bold 24px "Times New Roman",Times,serif;transition:opacity .4s}

</style>

<div id="splash"><div class="ttl">دورة مشغلين الآليات</div><img src="icon-512.png" alt=""></div>
<iframe id="app" title="دورة مشغلين الآليات" src="https://script.google.com/macros/s/AKfycbwJuSjBBE4tcxYskRdGllFb87SKaMdYKyi7WatbZDnC5xG91iMrSV1Ve-kVJZ9lpxK83A/exec"></iframe>
<script>
var s=document.getElementById('splash');function hide(){s.className='hide'}
document.getElementById('app').addEventListener('load',function(){setTimeout(hide,300)});setTimeout(hide,6000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
